# PR test gate (L88): runs with NO secrets on the untrusted merge ref. The
# auto-merge workflow requires this check green before any pre-approved
# merge. The 9-11 src/credential-admin failures are known-environmental
# (L6/L80) and that suite is excluded here; compare names, not counts.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --exclude 'src/credential-admin/**'
